<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Catalog - Online Student Course Management System</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Dynamic Header Navigation -->
  <div id="navbar-container"></div>

  <main class="container my-4">
    <!-- Header & Search -->
    <div class="row align-items-center mb-4">
      <div class="col-lg-6 mb-3 mb-lg-0">
        <h2 class="fw-bold text-dark mb-1">Explore Courses</h2>
        <p class="text-muted mb-0" id="activeFilterLabel">All Courses</p>
      </div>
      <div class="col-lg-6">
        <form id="searchForm" class="d-flex gap-2">
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
            <input type="text" id="searchInput" class="form-control border-start-0 ps-0" placeholder="Search by course title, code, or instructor...">
          </div>
          <button type="submit" class="btn btn-primary px-3">Search</button>
        </form>
      </div>
    </div>

    <!-- Category Filters -->
    <div class="d-flex flex-wrap gap-2 mb-4" id="categoryFilters">
      <!-- Populated dynamically -->
    </div>

    <!-- Loading Spinner -->
    <div id="coursesLoading" class="text-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading courses...</span>
      </div>
    </div>

    <!-- Empty State -->
    <div id="noCoursesFound" class="text-center py-5 d-none">
      <i class="bi bi-search fs-1 text-muted d-block mb-2"></i>
      <h5 class="fw-semibold text-dark">No courses found</h5>
      <p class="text-muted small">Try adjusting your search criteria or filter categories.</p>
    </div>

    <!-- Course Cards Grid -->
    <div class="row g-4" id="coursesGrid"></div>
  </main>

  <!-- Footer -->
  <footer class="text-center mt-auto">
    <div class="container">
      <p class="mb-1 fw-semibold text-dark">Online Student Course Management System</p>
      <p class="text-muted small mb-0">
        Developed by <strong class="text-primary">Angelin Sarah George</strong> &bull; Full Stack Web Development
      </p>
    </div>
  </footer>

  <!-- Bootstrap 5 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Navigation Script -->
  <script src="js/nav.js"></script>
  <!-- Courses Handler Script -->
  <script src="js/courses.js"></script>
</body>
</html>
