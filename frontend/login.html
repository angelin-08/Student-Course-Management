<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Online Student Course Management System</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Dynamic Header Navigation -->
  <div id="navbar-container"></div>

  <main class="container">
    <div class="auth-container">
      <div class="auth-card">
        <div class="text-center mb-4">
          <div class="rounded-circle bg-primary-subtle text-primary mx-auto d-flex align-items-center justify-content-center mb-2" style="width: 54px; height: 54px;">
            <i class="bi bi-box-arrow-in-right fs-3"></i>
          </div>
          <h3 class="fw-bold text-dark mb-1">Welcome Back</h3>
          <p class="text-muted small">Sign in to access your course portal</p>
        </div>

        <!-- Alert messages container -->
        <div id="alertContainer"></div>

        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label for="email" class="form-label fw-semibold small">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="bi bi-envelope text-muted"></i></span>
              <input type="email" class="form-control" id="email" placeholder="name@example.com" required autocomplete="username">
            </div>
          </div>

          <div class="mb-4">
            <label for="password" class="form-label fw-semibold small">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="bi bi-lock text-muted"></i></span>
              <input type="password" class="form-control" id="password" placeholder="Enter your password" required autocomplete="current-password">
            </div>
          </div>

          <button type="submit" id="submitBtn" class="btn btn-primary w-100 py-2 fw-semibold">
            <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
          </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top">
          <p class="text-muted small mb-0">
            Don't have an account? <a href="register.html" class="fw-semibold text-primary text-decoration-none">Register as a Student</a>
          </p>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="text-center mt-auto">
    <div class="container">
      <p class="mb-1 fw-semibold text-dark">Online Student Course Management System</p>
      <p class="text-muted small mb-0">
        Developed by <strong class="text-primary">Angelin Sarah George</strong> &bull; Full Stack Web Development
      </p>
    </div>
  </footer>

  <!-- Bootstrap 5 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Navigation Script -->
  <script src="js/nav.js"></script>
  <!-- Login Handler Script -->
  <script src="js/login.js"></script>
</body>
</html>
