<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration - Online Student Course Management System</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Dynamic Header Navigation -->
  <div id="navbar-container"></div>

  <main class="container">
    <div class="auth-container">
      <div class="auth-card">
        <div class="text-center mb-4">
          <div class="rounded-circle bg-primary-subtle text-primary mx-auto d-flex align-items-center justify-content-center mb-2" style="width: 54px; height: 54px;">
            <i class="bi bi-person-plus-fill fs-3"></i>
          </div>
          <h3 class="fw-bold text-dark mb-1">Create Student Account</h3>
          <p class="text-muted small">Join EduPortal and enroll in courses instantly</p>
        </div>

        <!-- Alert messages container -->
        <div id="alertContainer"></div>

        <form id="registerForm" novalidate>
          <div class="mb-3">
            <label for="fullName" class="form-label fw-semibold small">Full Name</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="bi bi-person text-muted"></i></span>
              <input type="text" class="form-control" id="fullName" placeholder="e.g. Angelin Sarah George" required autocomplete="name">
            </div>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label fw-semibold small">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="bi bi-envelope text-muted"></i></span>
              <input type="email" class="form-control" id="email" placeholder="name@example.com" required autocomplete="email">
            </div>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label fw-semibold small">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="bi bi-lock text-muted"></i></span>
              <input type="password" class="form-control" id="password" placeholder="At least 6 characters" minlength="6" required autocomplete="new-password">
            </div>
          </div>

          <div class="mb-4">
            <label for="confirmPassword" class="form-label fw-semibold small">Confirm Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="bi bi-lock-fill text-muted"></i></span>
              <input type="password" class="form-control" id="confirmPassword" placeholder="Re-enter your password" required autocomplete="new-password">
            </div>
          </div>

          <button type="submit" id="submitBtn" class="btn btn-primary w-100 py-2 fw-semibold">
            <i class="bi bi-person-plus-fill me-2"></i>Create Student Account
          </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top">
          <p class="text-muted small mb-0">
            Already have an account? <a href="login.html" class="fw-semibold text-primary text-decoration-none">Sign in here</a>
          </p>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="text-center mt-auto">
    <div class="container">
      <p class="mb-1 fw-semibold text-dark">Online Student Course Management System</p>
      <p class="text-muted small mb-0">
        Developed by <strong class="text-primary">Angelin Sarah George</strong> &bull; Full Stack Web Development
      </p>
    </div>
  </footer>

  <!-- Bootstrap 5 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Navigation Script -->
  <script src="js/nav.js"></script>
  <!-- Register Handler Script -->
  <script src="js/register.js"></script>
</body>
</html>
